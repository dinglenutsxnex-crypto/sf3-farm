name: Build farm app + CLI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK + Windows CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build CLI distribution
        run: ./gradlew :cli:installDist --no-daemon && (cd cli/build/install/cli && zip -qr $GITHUB_WORKSPACE/sf3farm-cli.zip sf3farm-cli)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sf3farm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: sf3farm-cli
          path: sf3farm-cli.zip
          retention-days: 30
